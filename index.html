function noise(d,v,fr){const a=au();if(!a||mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fr;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start()}
const snd={kick:()=>tone(160,40,.15,'sine',.8),cheer:()=>{noise(1.8,1.8,1400);tone(523,1046,.4,'triangle',.2)},miss:()=>tone(300,120,.5,'sawtooth',.15),whistle:()=>tone(2800,2600,.4,'sine',.15)};

function fb(t,c){const m=$('msg');m.textContent=t;m.style.color=c||'#fff';m.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>m.classList.remove('on'),2100)}
function updUI(){$('s').textContent=score;$('r').textContent=left}
function v0(yaw,p){const b=SP==='basket',f=b?.3:SP==='kasti'?.5:1,sp=b?5.8+3.6*p:14+12*p,th=b?.85:SP==='kasti'?.02+.25*p:.1+.25*p,c=sp*Math.cos(th),y=yaw*f;return new THREE.Vector3(c*Math.sin(y),sp*Math.sin(th),-c*Math.cos(y))}
function newShot(){ball.position.set(0,SY[SP],0);ball.v.set(0,0,0);pendV=null;wind=SP==='basket'?0:Math.round((Math.random()*2-1)*lvl.wm);aim.pow=.5;aim.yaw=0;res=null;kT=0;S='aim';ad.visible=true;
 $('wt').textContent=wind?'Angin: '+Math.abs(wind)+' km/jam '+(wind>0?'Kanan':'Kiri'):SP==='basket'?'Angin: Dalam ruangan':'Angin: Tenang';$('nw').style.opacity=wind?1:.25;$('nw').setAttribute('transform','rotate('+(wind>0?90:wind<0?-90:0)+')');
 fb('Percobaan ke-'+(6-left)+' • '+$('wt').textContent,'#fff')}

function kick(){if(S!=='aim'||aim.pow<.1)return;au();S='fly';left--;updUI();pendV=v0(aim.yaw,aim.pow);flightT=0;prevZ=0;kT=.0001;ad.visible=false}
function gain(p,t){score+=p;goals++;snd.cheer();fb(t+' +'+p+' poin','#ffd23f');res='goal';S='res';tRes=0;updUI();burst(ball.position.x,ball.position.y,ball.position.z)}
function bad(t){res='miss';fb(t,'#ff8a80');snd.miss();S='res';tRes=0}
function judgeX(m){const x=ball.position.x,y=ball.position.y,z=ball.position.z;
 if(SP==='basket'){const d=Math.hypot(x,z+7);if(!m&&d<.48)d<.14?gain(50,'SWISH! Masuk bersih!'):d<.3?gain(20,'Masuk!'):gain(10,'Masuk lewat ring!');else bad(Math.abs(x)>.45?'Melebar ke '+(x<0?'kiri':'kanan')+'!':z>-7?'Terlalu Pendek! Tambah kekuatan.':'Terlalu Jauh! Kurangi kekuatan.')}
 else{const d=Math.hypot(x,y-1.5);d<.35?gain(50,'Tepat di pusat!'):d<.75?gain(20,'Kena sasaran!'):d<1.2?gain(10,'Kena papan!'):bad(Math.abs(x)>Math.abs(y-1.5)?'Melebar ke '+(x<0?'kiri':'kanan')+'! Perhatikan angin.':y>1.5?'Terlalu Tinggi!':'Terlalu Rendah!')}}
function judge(m){if(SP!=='bola')return judgeX(m);const x=ball.position.x,y=ball.position.y,hw=GW/2;
 if(y>GH){res='high';fb('Terlalu Tinggi! Kurangi kekuatan.','#ff8a80');snd.miss()}
 else if(Math.abs(x)>hw){res='wide';fb('Melebar ke '+(x<0?'kiri':'kanan')+'! Perhatikan angin.','#ff8a80');snd.miss()}
 else if(Math.abs(x-keeper.position.x)<.8&&y<2.1){res='save';ball.v.set((Math.random()-.5)*4,3,5);fb('Ditepis Kiper! Coba sudut lebih jauh.','#ffb74d');snd.miss()}
 else{res='goal';const pt=Math.abs(x)>1.8?(y>1.2?50:20):10;score+=pt;goals++;burst(x,y,GZ);snd.cheer();fb('GOOOL! +'+pt+' poin'+(pt==50?' • Sudut Atas!':''),'#ffd23f')}
 S='res';tRes=0;updUI()}
function weak(){res='weak';fb('Kekuatan Terlalu Lemah!','#ff8a80');snd.miss();S='res';tRes=0}
function endGame(){S='end';const st=score>=150?'⭐⭐⭐':score>=70?'⭐⭐':'⭐';
 $('ov').innerHTML='<div class="card"><h2>Peluit Akhir! '+st+'</h2><p>Skor: <b>'+score+'</b> / 250 • Gol: <b>'+goals+'</b>/5</p><p>Refleksi PJOK: ketepatan butuh keseimbangan antara arah dan kekuatan. Angin mengubah lintasan bola, jadi latih membaca kondisi lapangan sebelum menendang.</p><div class="row"><button id="again">Main Lagi</button><button id="menu">Ganti Permainan</button></div></div>';
 $('ov').style.display='flex';$('again').onclick=startGame;$('menu').onclick=showMenu}
function step(dt){const b=ball;b.position.addScaledVector(b.v,dt);b.v.y-=G*dt;if(b.position.y>.3)b.v.x+=wind*.4*dt;
 if(b.position.y<=.22){b.position.y=.22;if(b.v.y<-1){b.v.y*=-.55;b.v.x*=.9;b.v.z*=.9}else{b.v.y=0;const f=Math.max(0,1-1.2*dt);b.v.x*=f;b.v.z*=f}}
 b.rotation.x+=b.v.z*dt/.22;b.rotation.z-=b.v.x*dt/.22}
function aimLine(){const p=new THREE.Vector3(0,SY[SP],0),v=v0(aim.yaw,aim.pow),a=ag.attributes.position;let e=false;for(let i=0;i<40;i++){if(!e){p.addScaledVector(v,.03);v.y-=G*.03;v.x+=wind*.4*.03;if(p.z<=PZ||p.y<.1){e=true;if(p.y<.1)p.y=.1}}a.setXYZ(i,p.x,p.y,p.z)}a.needsUpdate=true}
const clk=new THREE.Clock(),tp=new THREE.Vector3(),tl=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
 keeperT+=dt;keeper.position.x=Math.sin(keeperT*lvl.ks)*2.6;keeper.rotation.z=Math.cos(keeperT*lvl.ks)*-.25;
 {const w=Math.sin(keeperT*lvl.ks*4);K.legL.rotation.x=w*.3;K.legR.rotation.x=-w*.3;K.armR.rotation.z=.9+Math.abs(w)*.25;K.armL.rotation.z=-.9-Math.abs(w)*.25}
 if(S==='aim'){aimLine();const c=aim.pow;$('pf').style.width=c*100+'%';$('pf').style.background=c<.4?'#3ddc84':c<.7?'#ffd23f':'#ff4d4d';$('na').setAttribute('transform','rotate('+aim.yaw*57*3+')')}
 if(S==='fly'||S==='res'){prevZ=ball.position.z;prevY=ball.position.y;if(pendV){if(kT>PT[SP]){ball.v.copy(pendV);pendV=null;snd.kick()}}else step(dt);
  if(S==='fly'){flightT+=dt;if(SP==='basket'){if(prevY>3.05&&ball.position.y<=3.05&&ball.v.y<0)judge();else if(flightT>.3&&ball.position.y<=.23)judge(1);else if(flightT>5)weak()}else if(prevZ>PZ&&ball.position.z<=PZ)judge();else if(flightT>.6&&ball.position.z>PZ&&ball.position.y<=.23&&Math.hypot(ball.v.x,ball.v.z)<1.2||flightT>5)weak()}
  else{tRes+=dt;if(res==='goal'){if(SP==='bola'&&ball.position.z<GZ-1.4){ball.position.z=GZ-1.4;ball.v.z*=-.2;ball.v.x*=.3}else if(SP==='kasti'&&ball.position.z<PZ-.05){ball.position.z=PZ-.05;ball.v.set(0,0,0)}}if(tRes>2.4){left<=0?endGame():newShot()}}}
 if(kT>0){kT+=dt;const bk=SP==='basket',ks=SP==='kasti',t=Math.min(kT/.2,1),k=kT<.6?-.7+1.7*t:0;P.legR.rotation.x=bk||ks?.1:-k;P.legL.rotation.x=bk||ks?.1:.15;P.armL.rotation.x=ks?-1.3:bk?-2.4-.6*t:k*.8;P.armR.rotation.x=ks?-1.3:bk?-2.4-.6*t:-k*.8;P.g.rotation.x=ks?0:-.12*t;P.g.rotation.y=ks?3.63-2.3*Math.min(kT/.3,1):bk?Math.PI:Math.PI-.3;if(kT>.9)kT=0}else{const bk=SP==='basket',ks=SP==='kasti';P.legR.rotation.x=bk||ks?0:.25;P.legL.rotation.x=0;P.armL.rotation.x=P.armR.rotation.x=ks?-1.3:bk?-2.2:Math.sin(keeperT*2)*.06;P.g.rotation.x=0;P.g.rotation.y=ks?3.63:bk?Math.PI:Math.PI-.3}
 sh.position.set(ball.position.x,.03,ball.position.z);sh.scale.setScalar(Math.max(.4,1-ball.position.y*.15));
 for(let i=0;i<NP;i++){if(pl[i]>0){pl[i]-=dt;pv[i][1]-=6*dt;pp[i*3]+=pv[i][0]*dt;pp[i*3+1]+=pv[i][1]*dt;pp[i*3+2]+=pv[i][2]*dt}else pp[i*3+1]=-100}pg.attributes.position.needsUpdate=true;
 if(S==='fly'||(S==='res'&&tRes<1.6)){tp.set(ball.position.x*.5,Math.max(ball.position.y,.5)+1.3,Math.max(ball.position.z+5,-10));tl.copy(ball.position)}else{tp.copy(base);tl.set(0,1.2,-12)}
 cam.position.lerp(tp,.05);look.lerp(tl,.1);cam.lookAt(look);ren.render(scene,cam)}
function rs(){const w=W(),h=H(),p=w/h<1;ren.setSize(w,h);cam.aspect=w/h;cam.fov=p?75:55;cam.updateProjectionMatrix();base.set(0,p?2.2:1.7,p?7:5.4)}
addEventListener('resize',rs);rs();cam.position.copy(base);ball.position.set(0,.22,0);
// input
const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{if(S!=='aim')return;au();drag={x:e.clientX,y:e.clientY,y0:aim.yaw};aim.pow=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(S!=='aim')return;if(drag){const u=Math.min(W(),H())*.5;aim.pow=cl((drag.y-e.clientY)/u,0,1);aim.yaw=cl(drag.y0+(e.clientX-drag.x)/(u*1.2)*.3,-.3,.3)}else if(e.pointerType==='mouse')aim.yaw=cl((e.clientX/W()-.5)*.6,-.3,.3)});
cv.addEventListener('pointerup',()=>{if(drag&&S==='aim'){const p=aim.pow;drag=null;if(p>.12)kick();else aim.pow=.5}drag=null});
const pb=$('pb');function pset(e){if(S==='aim'&&(e.type==='pointerdown'||e.buttons)){const r=pb.getBoundingClientRect();aim.pow=cl((e.clientX-r.left)/r.width,0,1)}}
pb.addEventListener('pointerdown',e=>{pset(e);pb.setPointerCapture(e.pointerId)});pb.addEventListener('pointermove',pset);
$('kick').onclick=kick;
addEventListener('keydown',e=>{if(S!=='aim')return;if(e.key==='ArrowLeft')aim.yaw=cl(aim.yaw-.02,-.3,.3);if(e.key==='ArrowRight')aim.yaw=cl(aim.yaw+.02,-.3,.3);if(e.key==='ArrowUp')aim.pow=cl(aim.pow+.04,0,1);if(e.key==='ArrowDown')aim.pow=cl(aim.pow-.04,0,1);if(e.key===' ')kick()});

let pendV=null;const PT={bola:.12,basket:.15,kasti:.17};function setSport(s){SP=s;PZ=s==='kasti'?-14:s==='basket'?-7:GZ;goalObjs.forEach(o=>o.visible=s==='bola');hoopObjs.forEach(o=>o.visible=s==='basket');tgtObjs.forEach(o=>o.visible=s==='kasti');keeper.visible=s==='bola';
 ball.material.map=TX[s];ball.material.needsUpdate=true;ball.scale.setScalar(s==='bola'?1:s==='basket'?1.15:.55);grass.material.map=s==='basket'?wd:gt;grass.material.needsUpdate=true;P.g.position.set(s==='basket'?0:s==='kasti'?-.65:-.9,0,s==='basket'?.4:s==='kasti'?.5:.7);batG.visible=s==='kasti';tee.visible=s==='kasti';
 $('ttl').textContent='PJOK SIMULATOR • '+{bola:'PENALTI & AKURASI',basket:'TEMBAKAN BASKET',kasti:'PUKUL KASTI & SASARAN'}[s];
